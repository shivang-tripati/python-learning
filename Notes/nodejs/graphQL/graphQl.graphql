
# GraphQL is a query language for your API, and it's also a runtime for executing those queries by using a type system you define for your data. 
# It enables clients to request only the data they need and nothing more. Here's a breakdown of GraphQL API development: */

#  Schema Definition: In GraphQL, you start by defining a schema. The schema defines the types of data you can query and the relationships between them. 
# It's written in the GraphQL Schema Definition Language (SDL). Types include objects, interfaces, unions, enums, scalars, and input types. */
type Query {
    user(id: ID!): User
    users: [User]
  }
  
  type User {
    id: ID!
    name: String!
    email: String!
  }
  
# Resolvers: Resolvers are functions that define how to retrieve the data associated with a particular type in your schema. They're responsible for fetching the data for a specific field.
const resolvers = {
  Query: {
    user: (parent, { id }, context, info) => {
      // logic to fetch user data by id
    },
    users: (parent, args, context, info) => {
      // logic to fetch all users
    },
  },
};

# Queries and Mutations: Clients query data from a GraphQL API using queries, and they can also modify data using mutations.
#  Queries and mutations resemble the shape of the data they request or modify.
query {
  user(id: "1") {
    name
    email
  }
}

mutation {
  createUser(name: "John Doe", email: "john@example.com") {
    id
    name
    email
  }
}

# Validation and Execution: Once a query or mutation is received by the server, GraphQL validates the query against the schema to ensure it's well-formed and adheres to the type system.
#  Then it executes the query, resolving each field to the appropriate value.
# Subscriptions: GraphQL also supports subscriptions, allowing clients to receive real-time updates when data changes on the server.

